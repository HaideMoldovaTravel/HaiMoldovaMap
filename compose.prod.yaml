name: hai-moldova
# Production stack: no Mailpit, Postgres and MinIO stay on the internal network,
# and the app listens on the LAN for the external Nginx Proxy Manager.
x-app: &app
  image: hai-moldova-app:local
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    S3_ENDPOINT: http://minio:9000
  init: true
services:
  postgres:
    image: hai-moldova-postgres:17-postgis
    build: ./docker/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  minio:
    image: hai-moldova-minio:RELEASE.2025-10-15T17-29-55Z
    build: ./docker/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  initialize:
    <<: *app
    command: sh -c 'npm run db:migrate && npm run db:seed && npm run storage:init'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"
  app:
    <<: *app
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://localhost:3000/api/platform/config").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  worker:
    <<: *app
    command: npm run worker
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
  minio_data:
