name: hai-moldova
x-app: &app
  image: hai-moldova-app:local
  build: .
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    S3_ENDPOINT: http://minio:9000
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
  init: true
services:
  postgres:
    image: hai-moldova-postgres:17-postgis
    build: ./docker/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run setup}
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  minio:
    image: hai-moldova-minio:RELEASE.2025-10-15T17-29-55Z
    build: ./docker/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Run npm run setup}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Run npm run setup}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped
  initialize:
    <<: *app
    command: sh -c 'npm run db:migrate && npm run db:seed && npm run storage:init'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"
  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://localhost:3000/api/platform/config").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  worker:
    <<: *app
    command: npm run worker
    depends_on:
      initialize:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres_data:
  minio_data:
